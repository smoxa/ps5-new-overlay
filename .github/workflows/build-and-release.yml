name: Build and Release PS5 Overlay

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release'
        required: true
        type: boolean
        default: true
      release_version:
        description: 'Release Tag/Version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build PS5 Overlay ELF
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools and compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget unzip cmake ninja-build make \
            clang-18 lld-18 llvm-18 llvm-18-dev \
            python3

          # Ensure LLVM toolchain binaries and symlinks are set
          sudo ln -sf /usr/bin/llvm-config-18 /usr/bin/llvm-config
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld

      - name: Download and install PS5 Payload SDK
        run: |
          echo "Downloading latest PS5 Payload SDK v0.43..."
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip -O /tmp/ps5-payload-sdk.zip
          sudo rm -rf /opt/ps5-payload-sdk
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt
          sudo chmod -R 755 /opt/ps5-payload-sdk
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV
          echo "LLVM_CONFIG=/usr/bin/llvm-config-18" >> $GITHUB_ENV
          echo "/opt/ps5-payload-sdk/bin" >> $GITHUB_PATH
          test -x /opt/ps5-payload-sdk/bin/prospero-cmake
          test -x /opt/ps5-payload-sdk/bin/prospero-clang

      - name: Build ps5_overlay.elf
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          export LLVM_CONFIG=/usr/bin/llvm-config-18
          export PATH="/opt/ps5-payload-sdk/bin:/usr/lib/llvm-18/bin:${PATH}"

          mkdir -p build
          cd build
          prospero-cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target ps5_overlay_shellui --verbose -j$(nproc)

          # Embed the newly compiled shellui ELF into embedded_shellui.c
          python3 ../tools/bin2c.py ps5_overlay_shellui.elf ../src/embedded_shellui.c g_overlay_shellui_elf

          # Build the main overlay ELF with the embedded payload
          cmake --build . --target ps5_overlay --verbose -j$(nproc)
          cd ..

          mkdir -p dist
          cp build/ps5_overlay.elf dist/ps5_overlay.elf
          cp build/ps5_overlay_shellui.elf dist/ps5_overlay_shellui.elf

          cd dist
          sha256sum ps5_overlay*.elf > SHA256SUMS.txt
          echo "=== SHA256 Checksums ==="
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps5-overlay-build
          path: |
            dist/ps5_overlay.elf
            dist/ps5_overlay_shellui.elf
            dist/SHA256SUMS.txt
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ps5-overlay-build
          path: dist

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ inputs.release_version }}"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: PS5 Hardware Overlay ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎮 PS5 Hardware Overlay ${{ steps.vars.outputs.tag }}
            
            Lightweight, standalone in-game hardware monitoring overlay for jailbroken PlayStation 5 (FW 1.xx - 10.xx+, kstuff active).
            
            ### ✨ What's New in v1.0.15
            - **🧹 Streamlined Architecture (Pure In-Game Overlay)**:
              - Completely removed embedded HTTP web server, sockets, and heavy HTML template assets.
              - Minimal footprint, zero background network listening, and maximum stability.
            - **⚡ Real-Time In-Game FPS Counter**:
              - Hardware scanout flip delta sampling via Display Controller Engine (`/dev/dce`, `ioctl 0x80308217`).
              - Native fallback support for OnionHEN seqlock sampler (`/system_tmp/fps_sample`).
              - Dedicated **FPS** badge in gold/yellow (`#FFEB3B`) with live framerate (`60` / `120` / `--`).
              - Configurable via `show_fps = true` in `/data/ps5_overlay/config.ini`.
            - **🖥️ Native On-Screen In-Game HUD**:
              - Automatically injected into `SceShellUI` via `ptrace` (with `kstuff` active).
              - Rendered directly on top of gameplay via Mono PUI (`Scene.RootWidget`).
              - Sleek translucent 2D bar at top of screen with color-coded metrics:
                - **FPS** (Gold/Yellow `#FFEB3B`)
                - **CPU** (Green `#66FF66`)
                - **GPU** (Purple `#B366FF`)
                - **RAM** (Orange `#FFB34D`)
                - **FAN** (Cyan `#33E0FF`)
            - **🔕 Zero Toast Spam**:
              - Recurring notification popups completely disabled to protect your gameplay immersion.
              - Only a single silent startup toast confirms the overlay is loaded.
            
            ### 🚀 Quick Start
            1. Ensure **kstuff** is active on your PS5.
            2. Send `ps5_overlay.elf` to your console via port **9020** or **9021**:
               ```bash
               nc -w 3 <ps5_ip> 9020 < ps5_overlay.elf
               ```
            3. A single notification appears confirming the overlay is active.
            4. Launch any game — the hardware HUD bar appears at the top of the screen!
            
            ### 🔒 SHA-256 Checksums
            Included in `SHA256SUMS.txt`.
          files: |
            dist/ps5_overlay.elf
            dist/ps5_overlay_shellui.elf
            dist/SHA256SUMS.txt
            config.ini.example
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
